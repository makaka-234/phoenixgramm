name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK manually
        run: |
          cd $HOME
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d android-sdk
          mkdir -p android-sdk/cmdline-tools/latest
          mv android-sdk/cmdline-tools/* android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.0.2
        run: |
          cd $HOME
          wget https://services.gradle.org/distributions/gradle-8.0.2-bin.zip
          unzip -q gradle-8.0.2-bin.zip
          
      - name: Build with Gradle
        env:
          ANDROID_HOME: ${{ github.workspace }}/../android-sdk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          $HOME/gradle-8.0.2/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneixGram-APK
          path: app/build/outputs/apk/debug/app-debug.apk
